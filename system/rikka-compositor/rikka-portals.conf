# Which portal backend answers for which interface, in this session.
#
# The file chooser is the file manager's: a dialog that did not share its
# listing, its bookmarks and its thumbnail cache would be a second file
# manager that disagreed with the first one.
#
# The screen cast is the session's own: what may be shared is what this
# compositor is drawing, and the frames come from it without being copied.
#
# Everything else is left to whatever backend the machine has. `*` is the
# specification's word for "any of them"; the interfaces this desktop will
# answer for itself -- a screenshot, the appearance settings -- get a line
# here when the session's own backend exists.
#
# A backend is named by its `.portal` file rather than by the D-Bus name
# inside it: `rikka-files` is `rikka-files.portal`, and anything else is
# reported as unrecognized and quietly falls through to `*`.
[preferred]
default=*
org.freedesktop.impl.portal.FileChooser=rikka-files
org.freedesktop.impl.portal.ScreenCast=rikka-cast
