<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may hold the name, and who may talk to it. The second half is deliberately
  everybody: what a caller is allowed is polkit's question and not the bus's, and a bus
  policy that answered it first would be a second place for the answer to be wrong.
-->
<busconfig>
  <policy user="root">
    <allow own="os.rikka.Nix1"/>
  </policy>

  <policy context="default">
    <allow send_destination="os.rikka.Nix1"/>
  </policy>
</busconfig>
