<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base">
      <stop offset="0" stop-color="#e01b24"/>
      <stop offset="0.5" stop-color="#f6d32d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="tilted" xlink:href="#base" x1="0" y1="0" x2="1" y2="1"/>
    <linearGradient id="user" xlink:href="#base" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="90" y2="0" spreadMethod="reflect"/>
    <linearGradient id="repeated" href="#base" x2="0.25" spreadMethod="repeat" gradientTransform="rotate(30 0.5 0.5)"/>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#613583"/>
    </radialGradient>
    <radialGradient id="focal" xlink:href="#glow" fx="0.25" fy="0.3"/>
    <radialGradient id="ring" gradientUnits="userSpaceOnUse" cx="96" cy="96" r="12" spreadMethod="repeat">
      <stop offset="0" stop-color="#2ec27e"/>
      <stop offset="0.6" stop-color="#241f31"/>
      <stop offset="1" stop-color="#2ec27e"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="56" height="24" fill="url(#base)"/>
  <rect x="4" y="34" width="56" height="24" fill="url(#tilted)"/>
  <rect x="68" y="4" width="56" height="24" fill="url(#user)"/>
  <rect x="68" y="34" width="56" height="24" fill="url(#repeated)"/>
  <circle cx="32" cy="96" r="26" fill="url(#glow)"/>
  <ellipse cx="96" cy="74" rx="26" ry="10" fill="url(#focal)"/>
  <rect x="70" y="86" width="52" height="38" fill="url(#ring)" stroke="url(#base)" stroke-width="4"/>
</svg>
