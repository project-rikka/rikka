    <text x="120" y="44" text-anchor="middle" font-weight="bold">Middle</text>
    <text x="10" y="66" font-size="20" fill="url(#sweep)" stroke="#241f31" stroke-width="0.6">Paint</text>
    <text x="130" y="66">a<tspan fill="#c061cb" dy="-4">b</tspan><tspan dy="4">c</tspan></text>
