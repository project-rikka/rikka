<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6f5f4"/>
      <circle cx="4" cy="4" r="2.5" fill="#1c71d8"/>
    </pattern>
    <pattern id="stripes" width="0.25" height="1" patternTransform="rotate(30)">
      <rect width="4" height="64" fill="#e01b24"/>
    </pattern>
    <pattern id="scaled" width="0.5" height="0.5" viewBox="0 0 2 2">
      <rect width="1" height="1" fill="#26a269"/>
      <rect x="1" y="1" width="1" height="1" fill="#613583"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="56" height="56" fill="url(#dots)"/>
  <circle cx="96" cy="20" r="16" fill="url(#stripes)" stroke="url(#dots)" stroke-width="4"/>
  <rect x="72" y="40" width="48" height="20" fill="url(#scaled)"/>
</svg>
