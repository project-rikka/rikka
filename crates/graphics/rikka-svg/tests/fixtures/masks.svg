<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <defs>
    <linearGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="soft"><rect width="64" height="64" fill="url(#fade)"/></mask>
    <mask id="hole" maskUnits="userSpaceOnUse" x="64" y="0" width="64" height="64">
      <rect x="64" width="64" height="64" fill="#fff"/>
      <circle cx="96" cy="32" r="16" fill="#000"/>
      <circle cx="96" cy="32" r="8" fill="#808080"/>
    </mask>
    <mask id="alpha" mask-type="alpha" maskContentUnits="objectBoundingBox"><rect x="0.1" y="0.1" width="0.8" height="0.8" fill="#000" fill-opacity="0.5"/></mask>
  </defs>
  <rect width="64" height="64" fill="#c01c28" mask="url(#soft)"/>
  <g mask="url(#hole)">
    <rect x="64" width="64" height="64" fill="#1a5fb4"/>
    <rect x="64" y="24" width="64" height="16" fill="#f6d32d"/>
  </g>
  <rect x="20" y="40" width="24" height="20" fill="#26a269" mask="url(#alpha)"/>
</svg>
