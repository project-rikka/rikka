name: rbe-image

on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - rust-toolchain.toml
      - nix/**
      - third_party/rust/Cargo.lock
      - website/package.json
      - website/package-lock.json
      - .github/workflows/rbe-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rbe-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and push the images the registry lacks
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for image in rbe-image rbe-languages-image; do
            reference="$(nix eval --raw ".#$image.imageName"):$(nix eval --raw ".#$image.imageTag")"
            if nix run nixpkgs#skopeo -- inspect --creds "${{ github.actor }}:$REGISTRY_TOKEN" \
                "docker://$reference" > /dev/null 2>&1; then
              echo "$reference is already published"
              continue
            fi
            nix build ".#$image" --out-link stream
            ./stream | nix run nixpkgs#skopeo -- copy \
              --dest-creds "${{ github.actor }}:$REGISTRY_TOKEN" \
              docker-archive:/dev/stdin \
              "docker://$reference"
          done
