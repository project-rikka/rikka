name: gecko

on:
  push:
    branches: [main]
    paths:
      - engine/gecko/**
      - xtask/src/gecko/**
      - .github/workflows/gecko.yml
  pull_request:
    paths:
      - engine/gecko/**
      - xtask/src/gecko/**
      - .github/workflows/gecko.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gecko-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build engine
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GECKO_WORK: /mnt/gecko/work
      MOZBUILD_STATE_PATH: /mnt/gecko/mozbuild
      SCCACHE_DIR: /mnt/gecko/sccache
      SCCACHE_CACHE_SIZE: 6G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo install -d -o "$USER" -g "$(id -gn)" /mnt/gecko
          sudo fallocate -l 24G /mnt/gecko.swap
          sudo chmod 600 /mnt/gecko.swap
          sudo mkswap /mnt/gecko.swap
          sudo swapon /mnt/gecko.swap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          df -h / /mnt
          free -h

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-release-${{ hashFiles('engine/gecko/upstream.toml') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-release-${{ hashFiles('engine/gecko/upstream.toml') }}-
            sccache-release-

      - name: Build xtask
        run: |
          nix develop --command bazel run --script_path="$RUNNER_TEMP/xtask" //xtask
          nix develop --command bazel shutdown

      - name: Build and package
        timeout-minutes: 330
        run: nix develop --command "$RUNNER_TEMP/xtask" gecko package --release --work "$GECKO_WORK" --out "$RUNNER_TEMP/out"

      - name: Save compiler cache
        if: always() && github.event_name != 'pull_request' && steps.sccache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikka-gecko
          path: ${{ runner.temp }}/out/
          compression-level: 0
          if-no-files-found: error

      - name: Attest provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/*.tar.zst
