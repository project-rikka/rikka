name: website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - crates/graphics/rikka-theme/themes/rikka.toml
      - crates/graphics/rikka-theme/themes/rikka-light.toml
      - sdk/examples/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the fonts og.png draws with
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-inter

      - run: npm ci

      - run: npx astro build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
